name: Build DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build DMG
        run: ./scripts/build_dmg.sh

      - name: Publish DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LidGuard.dmg
